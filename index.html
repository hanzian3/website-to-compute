<!DOCTYPE html>
<html>
<head>
  <title>音视界演示平台</title>
  <style>
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    #result {
      margin-top: 20px;
      border: 1px solid #ddd;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>音视界音乐卡片生成器</h1>
    <input type="file" id="musicFile" accept="audio/*">
    <button onclick="processSong()">生成视觉卡片</button>
    <div id="result"></div>
  </div>

  <script>
    async function processSong() {
      const file = document.getElementById('musicFile').files[0];
      if (!file) return alert('请选择歌曲文件');
      
      // 显示加载状态
      document.getElementById('result').innerHTML = '生成中...';
      
      // 调用 Coze API
      const response = await fetch(
        'https://api.coze.com/open_api/v2/workflow/run?workflow_id=RootUser_2108787781', 
        {
          method: 'POST',
          body: JSON.stringify({ audio: await file.arrayBuffer() }),
          headers: { 'Content-Type': 'application/json' }
        }
      );
      
      const data = await response.json();
      // 显示结果
      document.getElementById('result').innerHTML = `
        <video src="${data.video_url}" controls></video>
        <a href="${data.video_url}" download>下载卡片</a>
      `;
    }
  </script>
</body>
</html>
